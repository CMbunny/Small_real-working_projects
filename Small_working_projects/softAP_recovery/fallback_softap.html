<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device — Recovery</title>
<!--
  Served by the device's firmware when it has no working WiFi path.
  Hard constraints:
    * No internet on this network — no webfonts, no CDN, no external assets.
    * Phone-first: this is opened on a mobile browser in the field.
    * Only WiFi SSID/password are accepted here. No other credentials
      travel over this page — the AP password is not unique enough to
      trust with anything sensitive.
-->
<style>
  :root{
    --bg:#0a0b0d; --surface:#121519; --card:#14181c;
    --border:#22272d; --text:#eef1f3; --muted:#98a2ab;
    --accent:#35d6a0; --gold-br:#eccb86; --err:#e0726a;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mn:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--ui);background:var(--bg);color:var(--text);
    min-height:100vh;padding:16px;line-height:1.55;
  }
  .wrap{max-width:480px;margin:0 auto}
  .brand{font-size:20px;font-weight:700;color:var(--gold-br)}
  .sub{font-size:12px;color:var(--muted);margin-top:2px}
  header{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px;
  }
  h2{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
     color:var(--muted);margin-bottom:12px}
  p{font-size:13px;margin-bottom:10px}
  label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.7px;
        text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
  input{
    width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-family:var(--mn);
    font-size:16px;outline:none;   /* 16px: prevents iOS Safari zoom-on-focus */
  }
  input:focus{border-color:var(--accent)}
  .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
  button{
    flex:1 1 130px;min-height:44px;padding:12px 16px;border:0;border-radius:8px;
    font-family:var(--ui);font-size:14px;font-weight:700;cursor:pointer;
  }
  .primary{background:var(--accent);color:#06140d}
  .ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .msg{font-size:12.5px;margin-top:12px;min-height:17px;color:var(--muted)}
  .msg.err{color:var(--err)}
  .msg.ok{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Device Recovery</div>
    <div class="sub">Reconnect this device to WiFi</div>
  </header>

  <div class="card">
    <h2>Enter site WiFi</h2>
    <p>The device will save these settings, then reboot to join your network.</p>

    <label for="ssid">WiFi name (SSID)</label>
    <input id="ssid" autocomplete="off" autocapitalize="none" spellcheck="false">

    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="off">

    <div class="row">
      <button class="primary" id="b-save">Save</button>
      <button class="ghost" id="b-boot">Reboot</button>
    </div>
    <div class="msg" id="m-prov"></div>
  </div>
</div>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };
function say(id, text, kind) {
  var el = $(id);
  el.textContent = text;
  el.className = "msg" + (kind ? " " + kind : "");
}
function post(url, body) {
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  }).then(function (r) {
    return r.json().catch(function () { return {}; })
      .then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
  });
}

$("b-save").addEventListener("click", function () {
  if (!$("ssid").value) { say("m-prov", "WiFi name is required.", "err"); return; }
  var body = { ssid: $("ssid").value, password: $("pass").value };
  say("m-prov", "Saving…");
  post("/provision", body).then(function (r) {
    if (r.ok) say("m-prov", "Saved. Tap Reboot to join the network.", "ok");
    else say("m-prov", (r.body && r.body.error) || "Save failed.", "err");
  }).catch(function () { say("m-prov", "Save failed — check the connection.", "err"); });
});

$("b-boot").addEventListener("click", function () {
  say("m-prov", "Rebooting…");
  post("/provision/boot").catch(function () {});
  setTimeout(function () {
    say("m-prov", "Rebooting. Rejoin the site WiFi, then open the device's address.", "ok");
  }, 600);
});
</script>
</body>
</html>
